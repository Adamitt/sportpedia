name: Push to PWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Test PWS connection
        env:
          PWS_URL: ${{ secrets.PWS_URL }}
        run: |
          echo "Testing connection to PWS..."
          if git ls-remote "$PWS_URL" >/dev/null 2>&1; then
            echo "✅ Connection to PWS OK"
          else
            echo "❌ Connection failed. Probably wrong URL, password needs encoding, or repo not created yet."
            git ls-remote "$PWS_URL" || true
            exit 128
          fi

      - name: Push to PWS
        env:
          PWS_URL: ${{ secrets.PWS_URL }}
        run: |
          # Get current branch name safely
          current_branch=${GITHUB_REF_NAME}
          echo "Current branch: $current_branch"

          # Push current branch to PWS master branch
          push_output=$(git push $PWS_URL $current_branch:master 2>&1)
          if [[ $? -ne 0 ]]; then
            echo "Push failed with output: $push_output"
            echo "Error: Unable to push changes. Please check the error message above and resolve any conflicts manually."
            exit 1
          fi
          echo "Push successful with output: $push_output"
