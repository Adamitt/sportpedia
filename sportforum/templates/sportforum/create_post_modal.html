{% load static %}

<!-- Modal for Create Post -->
<div id="crudModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-gray-800 bg-opacity-50 overflow-y-auto transition-opacity duration-300">
  <div id="crudModalContent" class="bg-white rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-[90vh] overflow-y-auto my-8 transform transition-all duration-300 opacity-0 scale-95">
    <!-- Modal header -->
    <div class="flex items-center justify-between p-4 border-b">
      <div>
        <h3 class="text-xl font-semibold text-gray-900">
          Create New Post
        </h3>
        <p class="text-sm text-gray-600 mt-1">Share your knowledge and start a discussion</p>
      </div>
      <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" onclick="hideModal()">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    
    <!-- Modal body -->
    <div class="px-6 py-4 space-y-6">
      <form id="postForm">
        <div class="mb-4">
          <label for="sport" class="block text-sm font-medium text-gray-700 mb-2">Sport Category</label>
          <select id="sport" name="sport" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            <option value="">Select a sport...</option>
            {% for category in categories %}
            <option value="{{ category.slug }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>
        
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Post Title</label>
          <input type="text" id="title" name="title" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Enter a catchy title..." required>
        </div>
        
        <div class="mb-4">
          <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Post Content</label>
          <textarea id="content" name="content" rows="6" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y" placeholder="Share your thoughts, tips, or questions..." required></textarea>
        </div>
        
        <div class="mb-4">
          <label for="tags" class="block text-sm font-medium text-gray-700 mb-2">Tags <span class="text-gray-500 font-normal text-xs">(Optional)</span></label>
          <input type="text" id="tags" name="tags" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="e.g., technique, equipment, training">
          <p class="mt-1 text-sm text-gray-500">💡 Separate tags with commas</p>
        </div>
      </form>
    </div>
    
    <!-- Modal footer -->
    <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
      <button type="button" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-50 transition-colors text-center" onclick="hideModal()">Cancel</button>
      <button type="submit" id="submitPost" form="postForm" class="order-1 sm:order-2 flex-1 bg-blue-600 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-700 transition-colors">Create Post</button>
    </div>
  </div>
</div>

<script>
  function showModal() {
      const modal = document.getElementById('crudModal');
      const modalContent = document.getElementById('crudModalContent');

      modal.classList.remove('hidden'); 
      setTimeout(() => {
        modalContent.classList.remove('opacity-0', 'scale-95');
        modalContent.classList.add('opacity-100', 'scale-100');
      }, 50); 
  }

  function hideModal() {
      const modal = document.getElementById('crudModal');
      const modalContent = document.getElementById('crudModalContent');

      modalContent.classList.remove('opacity-100', 'scale-100');
      modalContent.classList.add('opacity-0', 'scale-95');

      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150); 
  }

  async function addPostEntry() {
    const formData = new FormData(document.querySelector('#postForm'));
    
    try {
        const response = await fetch("{% url 'sportforum:add_post_ajax' %}", {
            method: "POST",
            body: formData,
        });

        if (response.ok) {
            document.getElementById("postForm").reset();
            hideModal();
            
            // Dispatch custom event to refresh posts
            document.dispatchEvent(new CustomEvent('postAdded'));
            
            // No alert for success - just refresh silently
        } else {
            const errorData = await response.json();
            alert('❌ Error: ' + (errorData.error || 'Failed to create post'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('❌ Failed to create post. Please try again.');
    }

    return false;
  }
  
  document.getElementById("postForm").addEventListener("submit", function(e) {
    e.preventDefault();
    addPostEntry();
  });
</script>
