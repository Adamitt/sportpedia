<!-- ================================ -->
<!-- MODAL EDIT GEAR (Final Version FIXED) -->
<!-- ================================ -->
<style>
#editModal {
  backdrop-filter: none;
}
#editModal .fixed.inset-0.bg-black\/50 {
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  background: rgba(0, 0, 0, 0.55) !important;
}
#editModal .bg-white {
  animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
}
@keyframes modalSlideUp {
  from {opacity: 0; transform: translateY(30px) scale(0.95);}
  to {opacity: 1; transform: translateY(0) scale(1);}
}
#editModal .border-b {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-bottom: none !important;
}
#editModal .border-b h3 {color: white !important; font-size: 26px;}
#editModal .border-b button {background: rgba(255,255,255,0.15); border-radius:10px; width:40px; height:40px; color:white;}
#editModal .border-b button:hover {background:rgba(255,255,255,0.25); transform:rotate(90deg);}
#editGearForm {max-height:calc(90vh - 180px); overflow-y:auto;}
#editGearForm::-webkit-scrollbar {width:8px;}
#editGearForm::-webkit-scrollbar-thumb {background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border-radius:10px;}
#editGearForm input, #editGearForm textarea, #editGearForm select {
  border:2px solid #e2e8f0; border-radius:12px; padding:13px 16px;
  font-size:15px; transition:all 0.2s ease; background:white;
}
#editGearForm input:focus, #editGearForm textarea:focus, #editGearForm select:focus {
  outline:none; border-color:#667eea; box-shadow:0 0 0 4px rgba(102,126,234,0.1);
}
#editGearForm button[type="submit"] {
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:white; padding:13px 28px; border-radius:12px; font-weight:600;
  box-shadow:0 4px 12px rgba(102,126,234,0.3);
}
#editGearForm button[type="submit"]:hover {
  box-shadow:0 6px 20px rgba(102,126,234,0.4); transform:translateY(-2px);
}
</style>

<div id="editModal" class="fixed inset-0 z-50 hidden overflow-y-auto">
  <div class="flex items-center justify-center min-h-screen px-4">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-black/50 transition-opacity" onclick="closeEditModal()"></div>
    
    <!-- Modal Box -->
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-3xl mx-auto my-8 z-10">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b">
        <h3 class="text-2xl font-bold">✏️ Edit Gear</h3>
        <button onclick="closeEditModal()">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Form -->
      <form id="editGearForm" class="p-6 space-y-4">
        {% csrf_token %}
        <input type="hidden" id="edit-gear-id">

        <div>
          <label class="block text-sm font-semibold">Nama Gear *</label>
          <input id="edit-name" type="text" required class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Deskripsi</label>
          <textarea id="edit-description" rows="3" class="w-full"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold">Kategori Olahraga *</label>
          <select id="edit-sport" required class="w-full">
            <option value="">Pilih Kategori</option>
            {% for s in all_sports %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold">Level *</label>
          <select id="edit-level" required class="w-full">
            <option value="beginner">🌱 Pemula</option>
            <option value="intermediate">⚡ Menengah</option>
            <option value="advanced">🏆 Lanjutan</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold">Harga</label>
          <input id="edit-price" type="text" placeholder="Rp 500.000 - Rp 1.000.000" class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Fungsi</label>
          <input id="edit-function" type="text" class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Brand Rekomendasi</label>
          <input id="edit-brands" type="text" placeholder="Nike, Adidas, Puma" class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Material</label>
          <input id="edit-materials" type="text" placeholder="Kulit, Mesh, Rubber" class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Link Beli</label>
          <input id="edit-buy" type="url" placeholder="https://tokopedia.com/..." class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">URL Gambar</label>
          <input id="edit-image" type="url" placeholder="https://example.com/image.jpg" class="w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold">Tips Perawatan</label>
          <textarea id="edit-care" rows="2" class="w-full"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold">Tags</label>
          <input id="edit-tags" type="text" placeholder="premium, outdoor, waterproof" class="w-full">
        </div>

        <!-- Error Message -->
        <div id="edit-error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-sm text-red-600 font-medium"></p>
        </div>

        <!-- Buttons -->
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" onclick="closeEditModal()" class="px-6 py-2.5 border-2 border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-50">
            Batal
          </button>
          <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 shadow-md">
            💾 Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
async function openEditModal(gearId) {
  console.log("🧩 openEditModal gearId =", gearId);

  const modal = document.querySelector('#editModal');
  if (!modal) {
    console.error("❌ #editModal not found in DOM!");
    return;
  }

  try {
    const res = await fetch(`/gearguide/get-gear-json/${gearId}/`);
    const data = await res.json();
    console.log("📦 Fetched data:", data);

    if (data.ok && data.data) {
      const g = data.data;
      document.querySelector('#edit-gear-id').value = g.id || "";
      document.querySelector('#edit-name').value = g.name || "";
      document.querySelector('#edit-description').value = g.description || "";
      document.querySelector('#edit-sport').value = g.sport_id || "";
      document.querySelector('#edit-level').value = g.level || "";
      document.querySelector('#edit-price').value = g.price_range || "";
      document.querySelector('#edit-function').value = g.function || "";
      document.querySelector('#edit-brands').value = (g.recommended_brands || []).join(", ");
      document.querySelector('#edit-materials').value = (g.materials || []).join(", ");
      document.querySelector('#edit-buy').value = g.buy_link || "";
      document.querySelector('#edit-image').value = g.image || "";
      document.querySelector('#edit-care').value = g.care_tips || "";
      document.querySelector('#edit-tags').value = (g.tags || []).join(", ");
    } else {
      console.warn("⚠️ No valid data received, opening modal anyway for manual edit.");
    }

    modal.classList.remove('hidden');
    console.log("✅ Modal opened successfully.");
  } catch (err) {
    console.error("❌ Error fetching gear data:", err);
    modal.classList.remove('hidden'); // tetap buka modal biar gak stuck
  }
}

function closeEditModal() {
  const modal = document.querySelector('#editModal');
  if (modal) modal.classList.add('hidden');
}
</script>
