{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-700 px-8 py-6">
      <h2 class="text-2xl font-bold text-white tracking-wide">Tambah Gear Baru</h2>
      <p class="text-indigo-200 text-sm mt-1">Isi detail perlengkapan olahraga dengan lengkap dan akurat.</p>
    </div>

    <!-- Form -->
    <div class="px-8 py-8">
      <form method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- RENDER TIAP FIELD DENGAN STYLE -->
        {% for field in form %}
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="text-sm text-red-500 mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
        {% endfor %}

        <!-- Tombol Aksi -->
        <div class="flex justify-end pt-6 border-t border-gray-200">
          <a href="{% url 'gearguide:add_gear' %}" 
             class="text-gray-600 hover:text-blue-800 font-medium px-5 py-2.5 rounded-lg transition-colors">
            Batal
          </a>
          <button type="submit"
            class="ml-3 bg-blue-900 text-white px-6 py-2.5 rounded-lg shadow hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 focus:outline-none transition-all">
            Simpan Gear
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
