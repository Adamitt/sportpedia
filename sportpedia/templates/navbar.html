{% load static %}
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 lg:px-12">
    
    <div class="flex items-center justify-between py-4 border-b border-gray-100">
      <a href="{% url 'landingpage:home' %}" class="flex items-center gap-3">
        <img src="{% static 'images/sportpedia.png' %}" alt="SportPedia Logo" class="w-14 h-14 object-contain">
        <h1 class="text-2xl font-extrabold text-blue-900">
          SPORT<span class="text-red-700">PEDIA</span>
        </h1>
      </a>

      <div class="hidden md:flex flex-grow max-w-2xl mx-8">
        <form action="{% url 'landingpage:search' %}" method="get" class="w-full relative">
          <input 
            type="text" 
            name="q"
            placeholder="Cari nama olahraga atau perlengkapan" 
            class="w-full border border-gray-300 rounded-full px-5 py-2.5 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 shadow-sm transition"
          >
          <button type="submit" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.9 14.32a8 8 0 111.414-1.414l4.387 4.387a1 1 0 01-1.414 1.414l-4.387-4.387zM14 8a6 6 0 11-12 0 6 6 0 0112 0z" clip-rule="evenodd" />
            </svg>
          </button>
        </form>
      </div>

      <div class="flex items-center gap-4">
        {% if request.user.is_authenticated %}
          <div class="relative" id="user-menu-container">
            <button id="user-menu-button" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 transition">
              <div class="w-8 h-8 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-sm">
                {{ request.user.first_name.0|default:request.user.username.0|upper }}
              </div>
              <span class="text-sm text-gray-700 font-semibold hidden md:block">
                {{ request.user.first_name|default:request.user.username }}
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>

            <div id="user-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-2xl py-2 hidden origin-top-right ring-1 ring-black ring-opacity-5 focus:outline-none" style="transition: transform 0.2s ease, opacity 0.2s ease; transform-origin: top right;">
              <a href="{% url 'profile_app:profile_page' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profil Saya</a>
              <div class="border-t border-gray-100 my-1"></div>
              <a href="{% url 'accounts:logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</a>
            </div>
          </div>

        {% else %}
          <a href="{% url 'accounts:login' %}" class="text-blue-900 font-semibold hover:text-blue-700 transition-colors duration-200">Sign in</a>
          <a href="{% url 'accounts:register' %}" class="bg-blue-900 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-blue-800 transition-colors duration-200 shadow-md">Sign up</a>
        {% endif %}
      </div>
    </div>

    <div class="flex justify-center gap-10 py-3 text-base font-semibold text-gray-800">
      <a href="{% url 'sportlibrary:show_sports' %}" class="hover:text-blue-900 pb-1 border-b-4 border-transparent hover:border-blue-900 transition-all duration-200">Sports Library</a>
      <a href="/forum/" class="hover:text-blue-900 pb-1 border-b-4 border-transparent hover:border-blue-900 transition-all duration-200">Community</a>
      <a href="{% url 'gearguide:show_all_gears' %}" class="hover:text-blue-900 pb-1 border-b-4 border-transparent hover:border-blue-900 transition-all duration-200">Gear Guide</a>
      <a href="/videos/" class="hover:text-blue-900 pb-1 border-b-4 border-transparent hover:border-blue-900 transition-all duration-200">Video Gallery</a>
      {% if request.user.is_staff or request.user.is_superuser %}
        <a href="{% url 'admin_sportpedia:dashboard' %}" class="hover:text-blue-900 pb-1 border-b-4 border-transparent hover:border-blue-900 transition-all duration-200">Admin Dashboard</a>
      {% endif %}
    </div>

  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const userMenuButton = document.getElementById('user-menu-button');
    const userMenu = document.getElementById('user-menu');

    if (userMenuButton && userMenu) {
      userMenuButton.addEventListener('click', function() {
        const isHidden = userMenu.classList.contains('hidden');
        if (isHidden) {
          userMenu.classList.remove('hidden');
          setTimeout(() => {
            userMenu.style.transform = 'scale(1)';
            userMenu.style.opacity = '1';
          }, 10);
        } else {
          userMenu.style.transform = 'scale(0.95)';
          userMenu.style.opacity = '0';
          setTimeout(() => {
            userMenu.classList.add('hidden');
          }, 200);
        }
      });

      window.addEventListener('click', function(e) {
        if (!userMenuButton.contains(e.target) && !userMenu.contains(e.target)) {
          if (!userMenu.classList.contains('hidden')) {
            userMenu.style.transform = 'scale(0.95)';
            userMenu.style.opacity = '0';
            setTimeout(() => {
              userMenu.classList.add('hidden');
            }, 200);
          }
        }
      });
    }
  });
</script>
