{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mx-auto max-w-md py-8">
  <h1 class="text-2xl font-bold mb-4">Login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
  </form>
</div>
{% endblock %}
